name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_verify:
    name: Build, Quality & Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Guard Rails
        run: ./gradlew checkLiteralColors checkHardcodedStrings checkFileSize checkRawShapes checkRawSurfaces checkGradientsAndShadows

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Verify Roborazzi Screenshots
        run: ./gradlew verifyRoborazziDebug

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Test & Lint Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.html
            app/build/reports/roborazzi/
            app/build/outputs/roborazzi/

      - name: Generate Visual Report
        if: always()
        run: ./gradlew visualReport

      - name: Upload Visual Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: build/visual-report/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  connected_tests:
    name: Connected Android Tests (API ${{ matrix.api-level }})
    needs: build_and_verify
    runs-on: macos-13
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Connected Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload Connected Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-results-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
